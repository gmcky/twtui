[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twtui"
version = "0.1.0"
description = "A terminal UI for watching Twitch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gmcky" }]
keywords = ["twitch", "tui", "terminal", "streamlink", "cli"]
dependencies = ["rich>=13", "requests>=2", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
twtui = "twtui.app:main"

[project.urls]
Homepage = "https://github.com/gmcky/twtui"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["twtui"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
# E4/E7/E9 + F (pyflakes) + I (import sort). Line length is the formatter's job,
# so E501 stays off; the aligned tables in config.py are guarded with fmt: off.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

